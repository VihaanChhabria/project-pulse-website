<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Pulse | Student-Led Health for Richmond</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@400;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Project Pulse brand palette
              'pulse-red': '#E61C24',
              'pulse-blue': '#5C93F7',
              'pulse-navy': '#0F1E36',
              'pulse-ice': '#E8F1FC',

              primary: '#E61C24',
              'on-primary': '#FFFFFF',
              'primary-container': '#E8F1FC',
              'on-primary-container': '#0F1E36',

              secondary: '#5C93F7',
              'on-secondary': '#0F1E36',
              'secondary-container': '#E8F1FC',
              'on-secondary-container': '#0F1E36',

              tertiary: '#E61C24',
              'on-tertiary': '#FFFFFF',
              'tertiary-container': '#E8F1FC',
              'on-tertiary-container': '#0F1E36',

              background: '#FFF8F3',
              'on-background': '#0F1E36',
              surface: '#FFFFFF',
              'surface-bright': '#FFF8F3',
              'on-surface': '#0F1E36',
              'surface-variant': '#E8F1FC',
              'on-surface-variant': '#0F1E36',

              'surface-container-lowest': '#FFFFFF',
              'surface-container-low': '#E8F1FC',
              'surface-container': '#E8F1FC',
              'surface-container-high': '#E8F1FC',
              'surface-container-highest': '#E8F1FC',

              outline: '#0F1E36',
              'outline-variant': '#0F1E36',
              'primary-fixed': '#E8F1FC',
              'on-primary-fixed': '#0F1E36',
              'on-secondary-fixed-variant': '#0F1E36',

              error: '#BA1A1A',
              'on-error': '#FFFFFF',
            },
            borderRadius: {
              DEFAULT: '0.25rem',
              lg: '0.5rem',
              xl: '0.75rem',
              full: '9999px',
              hero: '32px',
              card: '32px',
            },
            spacing: {
              'margin-desktop': '40px',
              'container-max': '1200px',
              unit: '8px',
              'margin-mobile': '20px',
              gutter: '24px',
            },
            fontFamily: {
              'headline-lg': ['DM Sans', 'sans-serif'],
              'headline-md': ['DM Sans', 'sans-serif'],
              'display-lg': ['DM Sans', 'sans-serif'],
              'headline-lg-mobile': ['DM Sans', 'sans-serif'],
              'label-md': ['Manrope', 'sans-serif'],
              'body-lg': ['Manrope', 'sans-serif'],
              'label-sm': ['Manrope', 'sans-serif'],
              'body-md': ['Manrope', 'sans-serif'],
            },
            fontSize: {
              'headline-lg': [
                '32px',
                { lineHeight: '40px', letterSpacing: '-0.01em', fontWeight: '500' },
              ],
              'headline-md': ['24px', { lineHeight: '32px', fontWeight: '500' }],
              'display-lg': [
                '48px',
                { lineHeight: '56px', letterSpacing: '-0.02em', fontWeight: '500' },
              ],
              'headline-lg-mobile': ['28px', { lineHeight: '36px', fontWeight: '500' }],
              'label-md': [
                '14px',
                { lineHeight: '20px', letterSpacing: '0.02em', fontWeight: '600' },
              ],
              'body-lg': ['18px', { lineHeight: '28px', fontWeight: '400' }],
              'label-sm': [
                '12px',
                { lineHeight: '16px', letterSpacing: '0.05em', fontWeight: '700' },
              ],
              'body-md': ['16px', { lineHeight: '24px', fontWeight: '400' }],
            },
          },
        },
      }

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
